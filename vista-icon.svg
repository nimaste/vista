<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tvGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3a6b"/>
      <stop offset="100%" stop-color="#0a1a3a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ea0ff"/>
      <stop offset="100%" stop-color="#2366d6"/>
    </linearGradient>
  </defs>

  <!-- TV antennae -->
  <line x1="48" y1="14" x2="38" y2="28" stroke="#1f3a6b" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="14" x2="90" y2="28" stroke="#1f3a6b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="48" cy="14" r="3.5" fill="#1f3a6b"/>
  <circle cx="80" cy="14" r="3.5" fill="#1f3a6b"/>

  <!-- TV body -->
  <rect x="18" y="28" width="92" height="66" rx="10" fill="url(#tvGrad)" stroke="#0a1a3a" stroke-width="2"/>

  <!-- TV screen -->
  <rect x="26" y="36" width="68" height="50" rx="5" fill="url(#screenGrad)"/>

  <!-- Speaker grille -->
  <circle cx="102" cy="50" r="2.3" fill="#5ea0ff"/>
  <circle cx="102" cy="60" r="2.3" fill="#5ea0ff"/>
  <circle cx="102" cy="70" r="2.3" fill="#5ea0ff"/>

  <!-- Play triangle on screen -->
  <polygon points="54,50 54,72 76,61" fill="#ffcc33"/>

  <!-- Film strip trailing off -->
  <path d="M24 100 Q 64 88 114 108" stroke="#2366d6" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M24 100 Q 64 88 114 108" stroke="#0a1a3a" stroke-width="4" fill="none" opacity="0.35"/>
  <!-- sprocket holes -->
  <g fill="#ffffff">
    <rect x="32" y="95" width="5" height="5" rx="1"/>
    <rect x="48" y="93" width="5" height="5" rx="1"/>
    <rect x="64" y="93" width="5" height="5" rx="1"/>
    <rect x="80" y="95" width="5" height="5" rx="1"/>
    <rect x="96" y="100" width="5" height="5" rx="1"/>
  </g>

  <!-- Clapperboard -->
  <g transform="translate(12,82) rotate(-8)">
    <rect x="0" y="0" width="38" height="26" rx="3" fill="#1f3a6b" stroke="#0a1a3a" stroke-width="1.5"/>
    <path d="M0 6 L38 2 L38 8 L0 12 Z" fill="#ffffff"/>
    <path d="M4 4 L10 2 L12 8 L6 10 Z" fill="#1f3a6b"/>
    <path d="M16 2 L22 1 L24 6 L18 8 Z" fill="#1f3a6b"/>
    <path d="M28 1 L34 0 L36 5 L30 6 Z" fill="#1f3a6b"/>
    <!-- star -->
    <polygon points="10,18 12,14 14,18 18,18 15,21 16,25 12,23 8,25 9,21 6,18" fill="#ffcc33"/>
  </g>
</svg>
