name: vista

services:
  vista:
    image: ghcr.io/nimaste/vista:latest
    container_name: vista
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/config/vista.db

      # Generate a real one with: openssl rand -hex 32  (32+ chars minimum).
      JWT_SECRET: CHANGE_ME_32_plus_random_characters_replace_this_value_before_first_run

      # URL native clients and the web admin UI hit from outside the LAN, via
      # Caddy's mTLS-protected vista.{your domain} site block. COOKIE_SECURE
      # is derived from the protocol when blank.
      PUBLIC_WEB_URL: CHANGE_ME_to_https://vista.your-domain
      COOKIE_SECURE: "true"
    volumes:
      # Vista's state (SQLite database + any future app config).
      - /mnt/cache/appdata/vista/config:/config
    ports:
      - "3456:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
